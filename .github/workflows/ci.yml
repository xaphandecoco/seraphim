name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # match the production image
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app || true   # advisory until the codebase is fully ruff-clean
      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          REDIS_URL: "redis://localhost:6379/0"
          ENVIRONMENT: "test"
        run: pytest tests/ -q
      - name: Dependency audit
        working-directory: backend
        run: pip-audit -r requirements.txt || true   # advisory

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (type-check + bundle)
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint || true   # advisory
      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev || true   # advisory
