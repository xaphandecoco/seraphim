# Honor the client's real protocol when behind a TLS-terminating proxy
# (Cloudflare Tunnel / Caddy). If no X-Forwarded-Proto header arrives (direct
# LAN HTTP), fall back to the connection scheme. This lets the backend set the
# refresh-cookie Secure flag correctly per request.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

# Log format that records $uri (normalized path, no query string) instead of
# $request, which would include ?_t=<JWT> in plaintext access logs.
# Status code, byte count, referer, and user-agent are preserved for ops/debug.
log_format scrubbed '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://seraphim-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # Defense-in-depth: scrub query parameters from logs (L6, no token leakage)
        access_log /var/log/nginx/access.log scrubbed;
    }

    # Exact-match for the SSE feed. Takes priority over /api/ for this path.
    # proxy_set_header lines re-declared in full — child location blocks do not
    # inherit proxy_set_header from a parent once any header is set here.
    # access_log uses scrubbed format: EventSource passes the token as ?_t=<JWT>
    # in the query string; $uri logs only the path, never $args.
    location = /api/tasks/feed {
        proxy_pass http://seraphim-backend:8000/tasks/feed;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        access_log /var/log/nginx/access.log scrubbed;
    }

    # Prefix-match for authenticated file serving. More specific than /api/ so
    # nginx selects this block for /api/storage/... requests.
    # nginx rewrites: /api/storage/x.jpg -> backend sees /storage/x.jpg,
    # matching the un-prefixed storage router route GET /storage/{file_path:path}.
    # proxy_set_header lines re-declared in full (same inheritance caveat above).
    # access_log uses scrubbed format: image src tags append ?_t=<JWT>; $uri omits
    # the query string so tokens are never written to the access log.
    location /api/storage/ {
        proxy_pass http://seraphim-backend:8000/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        access_log /var/log/nginx/access.log scrubbed;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Defense-in-depth: scrub query parameters from logs (L6, no token leakage)
        access_log /var/log/nginx/access.log scrubbed;
    }
}
