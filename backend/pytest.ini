[pytest]
asyncio_mode = auto
# Silence the loop-scope deprecation warning introduced in pytest-asyncio 0.24
# and required by 1.0+ (stable for all async fixtures in session scope).
asyncio_default_fixture_loop_scope = session
testpaths = tests
# Put the backend root (rootdir) on sys.path so `import app...` works under the
# canonical `pytest tests/` invocation and in Gitea CI (mirrors alembic.ini's
# prepend_sys_path = .). Without this, conftest fails with "No module named 'app'".
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
